name: Update Profile

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Find latest active repo
        id: latest
        run: |
          LATEST=$(gh api users/hamdi-ab/repos --jq '[.[] | select(.name != "hamdi-ab") | select(.pushed_at != null)] | sort_by(.pushed_at) | reverse | .[0]')
          echo "name=$(echo "$LATEST" | jq -r '.name')" >> "$GITHUB_OUTPUT"
          echo "desc=$(echo "$LATEST" | jq -r '.description // ""')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README
        env:
          REPO: ${{ steps.latest.outputs.name }}
          DESC: ${{ steps.latest.outputs.desc }}
        run: |
          if [ -z "$REPO" ]; then
            echo "No active repo found, skipping"
            exit 0
          fi

          LINE="**Currently Building:** *${REPO}*"
          if [ -n "$DESC" ]; then
            LINE="${LINE} $(printf '\u2014') ${DESC}"
          fi

          sed -i "s|<!--BUILDING-->.*|<!--BUILDING-->${LINE}|" README.md

          if ! git diff --quiet README.md; then
            git config user.name "hamdi-ab"
            git config user.email "hamdiabdulfetah22@gmail.com"
            git add README.md
            git commit -m "chore(profile): update currently building to ${REPO}"
            git push
          else
            echo "No change needed"
          fi
